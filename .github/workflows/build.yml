name: build-modules

on:
  workflow_dispatch:
    inputs:
      pspi_ref:
        description: "PSPi-Version-6 ref to build against"
        default: "main"
      release_tag:
        description: "tag to publish the release under (assets replaced on re-run)"
        default: "latest"
  # A tag push publishes a versioned release at the pushed tag. A manual run
  # publishes to the release_tag input (default "latest", a rolling release
  # whose assets are replaced on every dispatch).
  push:
    tags: ["v*"]

jobs:
  # Dynamic matrix source: one build job per facts file, in parallel, so the
  # whole fleet stays well under the single-job wall time as images are added.
  plan:
    runs-on: ubuntu-latest
    outputs:
      facts: ${{ steps.list.outputs.facts }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          # Basenames only: matrix values become artifact names, which may
          # not contain '/'. build.sh is handed kernels/<name> below.
          echo "facts=$(ls kernels/*.facts | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        facts: ${{ fromJSON(needs.plan.outputs.facts) }}
    # Native arm64 runner for every target: even the armhf (ARMv6) facts are
    # built here, cross-compiled, so no runner arch switching is needed.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libdw-dev curl git patch
          # libdw-dev supplies dwarf.h/-ldw for the kernel's gendwarfksyms
          # host tool (built during modules_prepare when the image kernel
          # config sets CONFIG_GENDWARFKSYMS=y, eg. Ubuntu 7.0).
          # The kernel modules_prepare toolchain for armhf targets.
          if grep -q '^ARCH=arm$' "kernels/${{ matrix.facts }}"; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf
          fi

      - name: Build ${{ matrix.facts }}
        run: |
          extra=()
          if grep -q '^ARCH=arm$' "kernels/${{ matrix.facts }}"; then
            extra+=(--cross-compile arm-linux-gnueabihf-)
          fi
          ./build.sh --pspi-ref "${{ github.event.inputs.pspi_ref || 'main' }}" \
            "${extra[@]}" "kernels/${{ matrix.facts }}"

      - name: Upload dist (every run)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.facts }}
          path: dist/

  # Collect one <IMAGE>-<module>.ko per built module. GitHub release assets
  # are flat, so the dist/<IMAGE>/ directory structure must be flattened into
  # the filename: the IMAGE (facts file's IMAGE= value) is unique per image
  # and is what consumers (eg. the PSPi patcher's distro scripts) key on.
  release:
    needs: build
    # Tag pushes release at the pushed tag; manual runs release at the
    # release_tag input (default "latest"). Re-publishing over an existing
    # tag updates that release and replaces same-named assets.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          pattern: dist-*
          # Every artifact holds dist/<IMAGE>/ for its own facts file, so the
          # IMAGE directories never collide across artifacts.
          merge-multiple: true

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find dist-all -name '*.ko' | while read -r ko; do
            image="$(basename "$(dirname "$ko")")"
            module="$(basename "$ko" .ko)"
            cp "$ko" "release-assets/${image}-${module}.ko"
          done
          find dist-all -name 'manifest.txt' | while read -r m; do
            image="$(basename "$(dirname "$m")")"
            cp "$m" "release-assets/${image}-manifest.txt"
          done
          ( cd release-assets && sha256sum * > SHA256SUMS )
          ls -l release-assets/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          # The pushed tag on tag pushes; the release_tag input otherwise.
          tag_name: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || (inputs.release_tag || 'latest') }}
          files: release-assets/*
